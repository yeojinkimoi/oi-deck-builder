# MY_DECK — disclosure xlsx -> figures + facts -> pptx
#
# Everything this deck needs lives in this folder. From here:
#
#   oi-deck run              walk the DAG, skipping fresh steps
#   oi-deck run --force      run everything
#   oi-deck run --dry-run    show what would run
#   oi-deck run --only figures
#   oi-deck lint             parse outline.md, build nothing
#   oi-deck check            style-check the built deck
#
# EDIT BEFORE FIRST RUN:
#   1. the disclosure filename in the `figures` step's `in:` list
#   2. the sheet name in code/figures.do
#
# Paths are relative to this folder, so nothing points at wherever
# oi-deck-builder is installed. Edges are inferred from the in/out lists --
# there is no separate `needs:` to keep in sync. A step reruns when an output
# is missing, an input is newer than an output, or a step it depends on reran.
#
# run: verbs
#   stata <file.do>     batch Stata; fails on a non-zero exit OR an r(NNN) in
#                       the log, because batch Stata exits 0 on some errors
#   oi-outline <args>   the outline -> deck.js -> .pptx step
#   oi-check <deck>     style report
#   node <script>       plain node
#   anything else       through the shell

deck: my_deck

steps:
  # figures.do reads the disclosure directly -- oi_use_disclosure infers the
  # schema, so there is usually no separate cleaning step. Add one (writing a
  # .dta that figures.do then reads) only if you need deck-specific recodes or
  # the read is slow enough to be worth caching.
  - id: figures
    run: stata code/figures.do
    in:
      - ../../Disclosures/sep2026/CHANGE_ME.xlsx
      - code/figures.do
    out:
      - figures/*.svg
      - figures/facts.json

  - id: deck
    run: oi-outline outline.md --fig-dir figures --output MyDeck.pptx
    in:
      - outline.md
      - figures/*.svg
      - figures/facts.json
    out:
      - MyDeck.pptx
